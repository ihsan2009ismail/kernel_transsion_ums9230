name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ upstream-302, master, susfs-testing ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # NB: keep this a literal -- the `runner` context is not available in
      # jobs.<id>.env, and referencing it there fails workflow validation.
      CLANG_DIR: /tmp/clang-r416183b
      # Mirror of what the vendor's own build config uses:
      #
      #   build.config.common : LLVM=1
      #                         CLANG_PREBUILT_BIN=.../clang-r416183b/bin
      #   build.config.aarch64: ARCH=arm64
      #                         LLVM_IAS=1
      #                         CROSS_COMPILE=aarch64-linux-gnu-
      #
      # The CROSS_COMPILE prefix is load-bearing: it is what supplies clang's
      # target triple.  With ARCH=arm64 alone clang still compiles for the
      # host, and the arm64 inline asm dies with
      # "unknown register name 'x0' in asm" in asm/atomic_lse.h.
      MAKE_ARGS: LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # drivers/kernelsu is a symlink into the KernelSU-Next submodule, and
          # the top-level Makefile is what pulls it in (drivers/Makefile:
          # obj-$(CONFIG_KSU) += kernelsu/).  Without this the link dangles and
          # the build dies with "drivers/kernelsu: No such file or directory".
          submodules: recursive

      # ReSukiSU's kernel/Kbuild derives its version from git (rev-list --count
      # and git describe --abbrev=0 --tags).  actions/checkout below depth 1
      # leaves the submodule shallow and tag-less, so Kbuild falls back to the
      # placeholder "v4.1.0" name and a bogus 30000+1+700 version code.
      # Unshallow and pull tags so the driver reports its real v4.2.0-rc2 tag.
      - name: Expand KernelSU submodule history and tags
        run: |
          git -C KernelSU fetch --unshallow --tags

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libc6-dev-arm64-cross supplies /usr/aarch64-linux-gnu/include, which
          # usr/include/Makefile adds to the UAPI header self-test.  That test is
          # cross-compiled with a bare AOSP clang and no sysroot, so without it
          # every UAPI header that includes a libc header (linux/virtio_ring.h ->
          # <stdint.h>, linux/dvb/video.h -> <time.h>) fails on a missing
          # glibc multilib header ('bits/libc-header-start.h',
          # 'bits/wordsize.h').  See the comment in usr/include/Makefile.
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils dwarves \
            libc6-dev-arm64-cross

      - name: Fetch the reference toolchain (clang-r416183b)
        run: |
          curl -sSL -o /tmp/clang.tar.gz \
            https://codeload.github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/tar.gz/refs/heads/lineage-20.0
          mkdir -p "$CLANG_DIR"
          tar xzf /tmp/clang.tar.gz -C "$CLANG_DIR" --strip-components=1
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version | head -1

      - name: Show kernel release
        run: |
          make $MAKE_ARGS bg6_defconfig
          echo "kernelrelease: $(make $MAKE_ARGS -s kernelrelease)"

      - name: Build Image
        run: |
          make $MAKE_ARGS -j$(nproc) Image

      # Mali GPU driver (mali_kbase.ko) is NOT part of the in-tree kernel build:
      # it lives in kernel_modules/.../gpu/natt/mali and is built out-of-tree via
      # its own Makefile against the just-built O=out tree. It carries the GPU
      # OC/DVFS changes (T606_GPLL_FREQ in platform/qogirl6).
      #
      # Config notes:
      #  - CONFIG_MALI_PLATFORM_NAME=qogirl6  -> platform/qogirl6 + -DQOGIRL6_GPU_POLLING
      #  - CONFIG_MALI_CSF_SUPPORT=y + MALI_USE_CSF=1 -> UMS9230 GPU is Mali-G57 (Valhall/CSF)
      #  - CONFIG_MALI_MIDGARD_DVFS=y -> platform DVFS (qogirl6 sw dvfs regs) drives
      #    the OC'd GPU clock; CONFIG_MALI_DEVFREQ=y matches the vendor's default
      #    (Kbuild:86-90 auto-sets it when PM_DEVFREQ + simple_ondemand are =y).
      #    With DEVFREQ=n the driver does not compile: several always-built files
      #    (mali_kbase_gpu_utilisation_debugfs.c, mali_kbase_gpu_stats_debugfs.c,
      #    backend pm_backend/pm_statistics/pm_ca, core_linux suspend) reference
      #    struct kbase_device members that only exist under CONFIG_MALI_DEVFREQ.
      #    Stock ko also shows "depends: sprd_gpu_cooling,trusty", which only
      #    materializes with DEVFREQ=y (devfreq.c + SPRD_GPU_COOLING). At runtime
      #    devfreq only registers if the DT has operating-points-v2; SPRD instead
      #    scales via the platform DVFS, so this is compile parity with stock.
      #  - CONFIG_MALI_GATOR_SUPPORT=n -> no external gator profiler dependency
      #  - MALI_JIT_PRESSURE_LIMIT_BASE=0 -> mandatory for CSF (MALI_USE_CSF=1) builds:
      #    the JIT pressure-limit code path (mali_kbase_mem.c) references JM-only UAPI
      #    flags (BASEP_MEM_PERFORM_JIT_TRIM, BASE_JIT_ALLOC_HEAP_INFO_IS_SIZE,
      #    KBASE_REG_TILER_ALIGN_TOP) that do not exist in the CSF build, and Kbuild
      #    defaults it to 1 (Kbuild:80). The vendor's CSF variant builds with it 0.
      #
      # Kernel .config requirements (all already =y in bg6_defconfig): ANDROID,
      # DMA_SHARED_BUFFER, PM_DEVFREQ, DEVFREQ_THERMAL, DEVFREQ_GOV_SIMPLE_ONDEMAND,
      # FW_LOADER, SYNC_FILE. GPU_TRACEPOINTS is not defined in this tree, so the
      # Kbuild guard sees it as unset rather than 'n' and passes.
      - name: Build Mali GPU module (mali_kbase.ko)
        run: |
          make $MAKE_ARGS modules_prepare
          make -C kernel_modules/kernel5.4/gpu/natt/mali \
            KDIR=$PWD/out \
            LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_MALI_MIDGARD=m \
            CONFIG_MALI_PLATFORM_NAME=qogirl6 \
            CONFIG_MALI_CSF_SUPPORT=y \
            MALI_USE_CSF=1 \
            CONFIG_MALI_MIDGARD_DVFS=y \
            CONFIG_MALI_DEVFREQ=y \
            CONFIG_MALI_GATOR_SUPPORT=n \
            MALI_JIT_PRESSURE_LIMIT_BASE=0

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: warn

      - name: Upload mali_kbase module
        uses: actions/upload-artifact@v4
        with:
          name: mali_kbase-${{ github.sha }}
          path: kernel_modules/kernel5.4/gpu/natt/mali/mali_kbase.ko
          if-no-files-found: warn